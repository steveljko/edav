# For an existing nginx, with certificates from certbot. Caddy in
# docker-compose.yml is less to maintain; this is here for a server that
# already terminates TLS.

server {
    listen 80;
    listen [::]:80;
    server_name dav.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dav.example.com;

    ssl_certificate     /etc/letsencrypt/live/dav.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dav.example.com/privkey.pem;

    # A vCard with a photo, or an event with a large attachment.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A sync of a large collection takes longer than a page load.
        proxy_read_timeout 300s;

        # DAV uses methods nginx does not buffer well.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# The well-known paths must be served from the root of the domain and must not
# require authentication. edav answers them itself, so the location block above
# already covers them; only add redirects here if edav is hosted under a
# subpath of a domain it does not own.
