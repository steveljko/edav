services:
  edav:
    build: .
    image: edav:latest
    restart: unless-stopped
    # Only the proxy reaches it; nothing needs to hit the port from outside.
    expose:
      - "8080"
    volumes:
      - edav-data:/data
    environment:
      # The address clients reach this server on. Set it: behind a proxy the
      # request arrives on an address no client can use, and the setup page
      # would then show the wrong one.
      EDAV_BASE_URL: https://dav.example.com
      EDAV_ADMIN_USERNAME: admin
      # Leave true wherever TLS terminates in front of this. Only set it false
      # to sign in to the admin interface over plain HTTP locally.
      EDAV_SECURE_COOKIES: "true"
    env_file:
      # Holds EDAV_ADMIN_PASSWORD, so the password is not in a file that is
      # committed. See deploy/edav.env.example.
      - edav.env

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - edav

volumes:
  edav-data:
  caddy-data:
  caddy-config:
